<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration – CollegeHub</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 24 24">
          <path d="M12 3L1 9L12 15L21 10.09V17H23V9M5 13.18V17.18L12 21L19 17.18V13.18L12 17L5 13.18Z"/>
        </svg>
        <span>CollegeHub</span>
      </a>
      <ul class="nav-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/login.html">Login</a></li>
      </ul>
    </div>
  </nav>

  <!-- Registration Form Container -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Student Registration</h2>
        <p>Create your new student account to access campus resources</p>
      </div>

      <!-- Alert Message Box -->
      <div id="alertBox" class="alert alert-danger" style="display: none;"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regName">Full Name</label>
          <input 
            type="text" 
            id="regName" 
            name="name" 
            class="form-control" 
            placeholder="e.g. Rahul Sharma" 
            required 
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">College Email Address</label>
          <input 
            type="email" 
            id="regEmail" 
            name="email" 
            class="form-control" 
            placeholder="e.g. student@collegehub.com" 
            required 
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="regBranch">Academic Branch</label>
          <select id="regBranch" name="branch" class="form-control" required>
            <option value="" disabled selected>-- Select Your Department --</option>
            <option value="Computer Science & Engineering">Computer Science & Engineering (CSE)</option>
            <option value="Information Technology">Information Technology (IT)</option>
            <option value="Electronics & Communication">Electronics & Communication (ECE)</option>
            <option value="Electrical Engineering">Electrical Engineering (EE)</option>
            <option value="Mechanical Engineering">Mechanical Engineering (ME)</option>
            <option value="Civil Engineering">Civil Engineering (CE)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <input 
            type="password" 
            id="regPassword" 
            name="password" 
            class="form-control" 
            placeholder="Minimum 6 characters" 
            required 
            autocomplete="new-password"
          >
          <div class="form-hint">Must contain at least 6 characters.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="regConfirmPassword">Confirm Password</label>
          <input 
            type="password" 
            id="regConfirmPassword" 
            name="confirmPassword" 
            class="form-control" 
            placeholder="Re-enter your password" 
            required 
            autocomplete="new-password"
          >
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="registerBtn">
          Create Student Account
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? 
        <a href="/login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-content">
      <p>&copy; 2026 CollegeHub – Smart College Management System.</p>
      <ul class="footer-links">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/login.html">Login</a></li>
      </ul>
    </div>
  </footer>

  <script src="/js/auth.js"></script>
</body>
</html>
